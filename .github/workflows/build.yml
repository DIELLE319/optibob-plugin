name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compila
        run: cmake --build build --config Release
      - name: Verifica motore (i numeri devono coincidere col Mac)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter prova-motore.exe | Select-Object -First 1
          & $exe.FullName
      - name: Raccogli Windows (VST3 + app standalone)
        uses: actions/upload-artifact@v4
        with:
          name: OptiBob-Windows
          path: |
            build/**/OptiBob.vst3
            build/**/OptiBob.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compila
        run: cmake --build build --config Release
      - name: Verifica motore (riferimento)
        run: |
          exe=$(find build -name prova-motore -type f | head -1)
          "$exe"
      - name: Raccogli Mac (AU + VST3 + app standalone)
        uses: actions/upload-artifact@v4
        with:
          name: OptiBob-macOS
          path: |
            build/**/OptiBob.vst3
            build/**/OptiBob.component
            build/**/OptiBob.app
