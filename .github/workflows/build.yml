name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: WebView2 SDK (per l'interfaccia)
        shell: pwsh
        run: |
          Register-PackageSource -ProviderName NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force | Out-Null
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -RequiredVersion 1.0.1901.177 -Source nugetRepository -Force | Out-Null
      - name: Configura
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compila
        shell: pwsh
        run: |
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ' error |error C|error LNK|fatal error' | Select-Object -First 25 | ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            exit 1
          }
      - name: Verifica motore (i numeri devono coincidere col Mac)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter prova-motore.exe | Select-Object -First 1
          $out = & $exe.FullName
          Write-Host $out
          if ($out -notmatch 'picco ([0-9.]+)\s+rms ([0-9.]+)') { Write-Error 'uscita non leggibile'; exit 1 }
          $picco = [double]$Matches[1]; $rms = [double]$Matches[2]
          $rifP = 0.439028; $rifR = 0.045825
          if ([math]::Abs($picco-$rifP) -gt 0.002 -or [math]::Abs($rms-$rifR) -gt 0.0005) {
            Write-Error "Windows DIVERSO dal Mac: picco $picco (atteso $rifP), rms $rms (atteso $rifR)"; exit 1
          }
          Write-Host "OK: su Windows il motore suona identico al Mac."
      - name: Installer (OptiBob-Windows-Setup.exe)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          Copy-Item installer-windows.iss build\
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer-windows.iss
          Get-ChildItem build\OptiBob-Windows-Setup.exe
      - name: Prova su Windows vero (installa, apre, disinstalla)
        shell: pwsh
        run: |
          $p = Start-Process build\OptiBob-Windows-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/COMPONENTS=desktop,plugin' -Wait -PassThru
          $exe = "$env:ProgramFiles\OptiBob Live\OptiBob.exe"
          $vst = "$env:CommonProgramFiles\VST3\OptiBob.vst3"
          if (Test-Path $exe) { Write-Output "::notice::Installato: $exe" } else { Write-Output "::error::App NON installata"; exit 1 }
          if (Test-Path $vst) { Write-Output "::notice::Plugin installato: $vst" } else { Write-Output "::error::Plugin VST3 NON installato"; exit 1 }
          $a = Start-Process $exe -PassThru; Start-Sleep -Seconds 20
          if (Get-Process -Id $a.Id -ErrorAction SilentlyContinue) { Write-Output "::notice::OptiBob Live si apre e resta aperto (20 s)"; Stop-Process -Id $a.Id -Force }
          else { Write-Output "::error::OptiBob Live si chiude da solo all'avvio (codice $($a.ExitCode))"; exit 1 }
          $u = Get-ChildItem "$env:ProgramFiles\OptiBob Live" -Filter 'unins*.exe' | Select-Object -First 1
          Start-Process $u.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait; Start-Sleep -Seconds 3
          if ((Test-Path $exe) -or (Test-Path $vst)) { Write-Output "::error::La disinstallazione lascia dei file" } else { Write-Output "::notice::Disinstallazione pulita" }
      - uses: actions/upload-artifact@v4
        with:
          name: OptiBob-Windows
          path: build/OptiBob-Windows-Setup.exe

  pubblica-download:
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: OptiBob-Windows, path: rilascio }
      - name: Pubblica i download (www.optibob.com punta a releases/latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: OptiBob 1.0.1
          make_latest: true
          body: |
            OptiBob-Mac.pkg — OptiBob Live (app) + OptiBob Plugin (AU/VST3) + BlackHole 2ch for macOS before 14.4
            OptiBob-Windows-Setup.exe — OptiBob Live (app) + OptiBob Plugin (VST3)
            OptiBobPlayer.zip — OptiBob Player for Mac (free)
          files: |
            rilascio/OptiBob-Windows-Setup.exe
