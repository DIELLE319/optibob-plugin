name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: WebView2 SDK (per l'interfaccia)
        shell: pwsh
        run: |
          Register-PackageSource -ProviderName NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force | Out-Null
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -RequiredVersion 1.0.1901.177 -Source nugetRepository -Force | Out-Null
      - name: Configura
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compila
        run: cmake --build build --config Release
      - name: Verifica motore (i numeri devono coincidere col Mac)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter prova-motore.exe | Select-Object -First 1
          $out = & $exe.FullName
          Write-Host $out
          if ($out -notmatch 'picco ([0-9.]+)\s+rms ([0-9.]+)') { Write-Error 'uscita non leggibile'; exit 1 }
          $picco = [double]$Matches[1]; $rms = [double]$Matches[2]
          $rifP = 0.439028; $rifR = 0.045825
          if ([math]::Abs($picco-$rifP) -gt 0.002 -or [math]::Abs($rms-$rifR) -gt 0.0005) {
            Write-Error "Windows DIVERSO dal Mac: picco $picco (atteso $rifP), rms $rms (atteso $rifR)"; exit 1
          }
          Write-Host "OK: su Windows il motore suona identico al Mac."
      - name: Installer (OptiBob-Windows-Setup.exe)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          Copy-Item installer-windows.iss build\
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer-windows.iss
          Get-ChildItem build\OptiBob-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: OptiBob-Windows
          path: build/OptiBob-Windows-Setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compila
        run: cmake --build build --config Release -j4
      - name: Verifica motore (riferimento)
        run: |
          exe=$(find build -name prova-motore -type f | head -1)
          "$exe"
      - name: Installer (OptiBob-Mac.pkg)
        run: BUILD="$PWD/build" OUT="$PWD/out" SALTA_COMPILA=1 bash installer-mac.command
      - uses: actions/upload-artifact@v4
        with:
          name: OptiBob-macOS
          path: out/OptiBob-Mac.pkg

  pubblica-download:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: OptiBob-Windows, path: rilascio }
      - uses: actions/download-artifact@v4
        with: { name: OptiBob-macOS, path: rilascio }
      - run: cp OptiBobPlayer.zip rilascio/ && ls -la rilascio
      - name: Pubblica i download (www.optibob.com punta a releases/latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: OptiBob 1.0.1
          make_latest: true
          body: |
            OptiBob-Mac.pkg — OptiBob Live (app) + OptiBob Plugin (AU/VST3) + BlackHole 2ch for macOS before 14.4
            OptiBob-Windows-Setup.exe — OptiBob Live (app) + OptiBob Plugin (VST3)
            OptiBobPlayer.zip — OptiBob Player for Mac (free)
          files: |
            rilascio/OptiBob-Windows-Setup.exe
            rilascio/OptiBobPlayer.zip
